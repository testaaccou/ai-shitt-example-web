<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grow With Indiw</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 45%, #090d16 100%);
      color: #0f172a;
      min-height: 100vh;
    }
    .nas-shell {
      background: #ffffff;
      box-shadow: 0 25px 60px -15px rgba(30, 27, 75, 0.7);
    }
    .grad-blue-purple {
      background: linear-gradient(135deg, #2563eb 0%, #6366f1 50%, #9333ea 100%);
    }
    .grad-text {
      background: linear-gradient(135deg, #1d4ed8 0%, #7e22ce 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .grad-subtle-bar {
      background: linear-gradient(180deg, #dbeafe 0%, #ede9fe 60%, #ffffff 100%);
    }
    .product-card {
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 32px -10px rgba(99, 102, 241, 0.22);
      border-color: #818cf8;
    }
  </style>
</head>
<body class="py-0 sm:py-8 px-0 sm:px-4">

  <div class="max-w-4xl mx-auto nas-shell sm:rounded-3xl overflow-hidden min-h-screen sm:min-h-0 pb-14">

    <!-- Top Header Bar -->
    <div class="grad-subtle-bar px-5 py-3.5 flex items-center justify-between border-b border-indigo-100/60">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl p-0.5 grad-blue-purple shadow-sm overflow-hidden">
          <img src="profile.jpg" onerror="this.src='https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80'" alt="Indiw" class="w-full h-full object-cover rounded-[10px]" />
        </div>
        <button onclick="switchTab('products')" class="p-1.5 rounded-lg hover:bg-indigo-100/60 text-slate-700 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
      </div>
      <div>
        <button onclick="openAddModal()" class="px-3.5 py-1.5 rounded-xl grad-blue-purple text-white font-bold text-xs shadow hover:opacity-90 transition">
          + Add New Item
        </button>
      </div>
    </div>

    <!-- Hero Banner -->
    <div class="relative h-48 sm:h-64 w-full overflow-hidden bg-slate-900">
      <img src="banner.jpg" onerror="this.src='https://images.unsplash.com/photo-1620712943543-bcc4688e7485?auto=format&fit=crop&w=1400&q=80'" alt="Cover" class="w-full h-full object-cover object-center" />
      <div class="absolute inset-0 bg-gradient-to-tr from-blue-900/50 via-purple-900/30 to-transparent"></div>
    </div>

    <!-- Avatar & Title -->
    <div class="px-6 text-center relative">
      <div class="relative w-24 h-24 sm:w-28 sm:h-28 mx-auto -mt-12 sm:-mt-14 rounded-3xl p-1 grad-blue-purple shadow-xl">
        <img src="profile.jpg" onerror="this.src='https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=400&q=80'" alt="Indiw" class="w-full h-full object-cover rounded-[20px] bg-slate-900 border-2 border-white" />
        <div class="absolute -bottom-1 -right-1 w-7 h-7 rounded-full bg-sky-500 border-2 border-white text-white flex items-center justify-center shadow-md">✓</div>
      </div>

      <h1 class="mt-3.5 text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900">Grow With Indiw</h1>
      <button onclick="switchTab('products')" class="mt-1 text-sm font-semibold text-indigo-600 hover:text-purple-700">Member &gt;</button>

      <div class="flex items-center justify-center gap-8 mt-6 border-b border-slate-200 text-sm font-semibold">
        <button onclick="switchTab('home')" id="tab-home" class="pb-3.5 border-b-2 border-transparent text-slate-500 hover:text-slate-900 transition">Home</button>
        <button onclick="switchTab('products')" id="tab-products" class="pb-3.5 border-b-2 border-indigo-600 text-slate-900 transition">Products (<span id="product-count">3</span>)</button>
        <button onclick="switchTab('community')" id="tab-community" class="pb-3.5 border-b-2 border-transparent text-slate-500 hover:text-slate-900 transition">Community</button>
      </div>
    </div>

    <!-- Content Sections -->
    <div class="px-5 sm:px-8 pt-6">
      <div id="section-home" class="hidden space-y-6">
        <div class="rounded-2xl p-6 text-white grad-blue-purple shadow-lg">
          <h2 class="text-xl font-extrabold">Welcome to Grow With Indiw</h2>
          <p class="text-sm text-blue-100 mt-2">All official Indiw PDF Master Prompts unlocked.</p>
        </div>
      </div>

      <div id="section-products">
        <div class="flex flex-col sm:flex-row gap-3 justify-between items-center mb-6">
          <input id="search-input" type="text" oninput="renderProducts()" placeholder="Search guides..." class="w-full sm:w-80 px-4 py-2.5 rounded-xl bg-slate-100 border border-slate-200 text-sm focus:outline-none focus:border-indigo-500" />
        </div>
        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
      </div>

      <div id="section-community" class="hidden space-y-4">
        <div class="p-5 rounded-2xl bg-indigo-50 border border-indigo-100">
          <h3 class="text-base font-extrabold text-slate-900">Official Community Updates</h3>
          <p class="text-sm text-slate-600 mt-1">Check back here for the latest workflow blueprints by Indiw.</p>
        </div>
      </div>
    </div>

  </div>

  <!-- Add Modal -->
  <div id="add-modal" class="fixed inset-0 z-50 hidden bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-lg font-extrabold text-slate-900 mb-4">Add New Item</h3>
      <div class="space-y-3">
        <input id="new-title" type="text" placeholder="Title" class="w-full px-3 py-2 rounded-xl bg-slate-100 border text-sm" />
        <input id="new-category" type="text" placeholder="Category" class="w-full px-3 py-2 rounded-xl bg-slate-100 border text-sm" />
        <input id="new-image" type="url" placeholder="Cover Image URL" class="w-full px-3 py-2 rounded-xl bg-slate-100 border text-sm" />
        <textarea id="new-desc" placeholder="Description" rows="2" class="w-full px-3 py-2 rounded-xl bg-slate-100 border text-sm"></textarea>
        <textarea id="new-prompt" placeholder="Master Prompt" rows="2" class="w-full px-3 py-2 rounded-xl bg-slate-100 border text-xs font-mono"></textarea>
      </div>
      <div class="flex justify-end gap-2 mt-5">
        <button onclick="closeAddModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-xs font-bold">Cancel</button>
        <button onclick="saveNewItem()" class="px-4 py-2 rounded-xl grad-blue-purple text-white text-xs font-bold">Save</button>
      </div>
    </div>
  </div>

  <!-- Product Modal -->
  <div id="product-modal" class="fixed inset-0 z-50 hidden bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl max-h-[90vh] flex flex-col">
      <div class="h-44 relative bg-slate-900">
        <img id="modal-image" src="" alt="" class="w-full h-full object-cover" />
        <button onclick="closeProductModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-black/50 text-white font-bold">✕</button>
      </div>
      <div class="p-6 overflow-y-auto">
        <h2 id="modal-title" class="text-xl font-extrabold text-slate-900"></h2>
        <p id="modal-desc" class="text-sm text-slate-600 mt-2"></p>
        <div class="mt-4">
          <button onclick="copyPrompt()" id="copy-btn" class="px-3 py-1.5 rounded-lg grad-blue-purple text-white text-xs font-bold">Copy Prompt</button>
          <pre id="modal-prompt" class="p-3 mt-2 rounded-xl bg-slate-900 text-indigo-100 text-xs font-mono whitespace-pre-wrap"></pre>
        </div>
        <div class="mt-5 flex justify-end">
          <button onclick="closeProductModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-xs font-bold">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const defaultProducts = [
      { 
        title: "RUG TUFTING VIDEOS", 
        category: "Crafts & ASMR", 
        image: "https://images.unsplash.com/photo-1584992236310-6edddc08a313?auto=format&fit=crop&w=800&q=80", 
        desc: "Complete AI system for viral rug tufting reels.", 
        prompt: `RUG TUFTING VIDEOS — Master Prompt By Indiw

Step 1 – Give the Master Prompt to Claude
Copy the Master Prompt.
Open a new Claude chat and paste it.
Claude will instantly give you 5 random string art video ideas (subject + a one-line hook each).

Step 2 – Confirm the ideas
If the 5 ideas look good → say "OK".
If not → say "I want different ideas", and Claude will give you a fresh set of 5.
Once you say OK, Claude generates 5 full prompts (one for each idea).

Step 3 – Copy the prompt set
Copy the promopt.

Step 4 – Go to Google Flow
Open Google Flow.
Paste the entire prompt you copied.` 
      },
      { 
        title: "ANIMAL FEEDING VIDEOS", 
        category: "Animals", 
        image: "https://images.unsplash.com/photo-1564349683136-77e08dba1ef7?auto=format&fit=crop&w=800&q=80", 
        desc: "Viral animal feeding video workflow.", 
        prompt: `ANIMAL FEEDING VIDEOS — Master Prompt By Indiw

Step 1: Choose single or group animal feeding.
Step 2: Select video duration (10s, 15s, or 30s).
Step 3: Generate sequential cinematic video prompts with species-accurate feeding behavior.` 
      }
    ];

    let products = JSON.parse(localStorage.getItem('indiw_vault_v5')) || defaultProducts;
    let activeCategory = 'all';
    let currentProduct = null;

    function renderProducts() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const grid = document.getElementById('products-grid');
      const filtered = products.filter(p => p.title.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query));
      document.getElementById('product-count').innerText = products.length;
      grid.innerHTML = filtered.map((p, idx) => `
        <div onclick="openProductModal(${idx})" class="cursor-pointer rounded-2xl bg-white border border-slate-200 overflow-hidden product-card">
          <div class="h-36 bg-slate-900 relative"><img src="${p.image}" class="w-full h-full object-cover"></div>
          <div class="p-4">
            <h3 class="text-sm font-bold text-slate-900">${p.title}</h3>
            <p class="text-xs text-slate-500 mt-1 line-clamp-2">${p.desc}</p>
          </div>
        </div>
      `).join('');
    }

    function openProductModal(idx) {
      currentProduct = products[idx];
      document.getElementById('modal-image').src = currentProduct.image;
      document.getElementById('modal-title').innerText = currentProduct.title;
      document.getElementById('modal-desc').innerText = currentProduct.desc;
      document.getElementById('modal-prompt').innerText = currentProduct.prompt;
      document.getElementById('product-modal').classList.remove('hidden');
    }

    function closeProductModal() { document.getElementById('product-modal').classList.add('hidden'); }
    function openAddModal() { document.getElementById('add-modal').classList.remove('hidden'); }
    function closeAddModal() { document.getElementById('add-modal').classList.add('hidden'); }

    function saveNewItem() {
      const title = document.getElementById('new-title').value.trim();
      if (!title) return;
      products.unshift({
        title: title.toUpperCase(),
        category: document.getElementById('new-category').value.trim() || 'Custom',
        image: document.getElementById('new-image').value.trim() || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80',
        desc: document.getElementById('new-desc').value.trim() || 'Custom item.',
        prompt: document.getElementById('new-prompt').value.trim() || 'Custom prompt.'
      });
      localStorage.setItem('indiw_vault_v5', JSON.stringify(products));
      closeAddModal();
      renderProducts();
    }

    function copyPrompt() {
      if (!currentProduct) return;
      navigator.clipboard.writeText(currentProduct.prompt);
      document.getElementById('copy-btn').innerText = 'Copied!';
      setTimeout(() => document.getElementById('copy-btn').innerText = 'Copy Prompt', 1500);
    }

    function switchTab(tab) {
      ['home', 'products', 'community'].forEach(t => {
        document.getElementById('section-' + t).classList.toggle('hidden', t !== tab);
        document.getElementById('tab-' + t).className = (t === tab) ? 'pb-3.5 border-b-2 border-indigo-600 text-slate-900 transition' : 'pb-3.5 border-b-2 border-transparent text-slate-500 hover:text-slate-900 transition';
      });
    }

    renderProducts();
  </script>
</body>
</html>
